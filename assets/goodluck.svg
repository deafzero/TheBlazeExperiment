<svg width="450" height="100" viewBox="0 0 450 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .char {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-size: 44px;
        font-weight: 900;
        fill: white;
        opacity: 0;
